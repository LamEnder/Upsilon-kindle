# Upsilon settings for Kindle. Uncomment and edit, then relaunch.

# Extra command line options, e.g. force a language at every start
# (otherwise the language picked in Settings is remembered):
#UPSILON_ARGS="--language fr"

# Zoom of the calculator screen (default: largest that leaves room for
# the keypad, 3 on a Paperwhite 4). 2 gives bigger keys.
#export UPSILON_SCALE=2

# Do a full (flashing) refresh every N partial updates to clear ghosting.
# 0 disables it; you can always tap "clean screen".
#export UPSILON_FLASH_EVERY=40

# Darken mid grays (>1) or lighten them (<1).
#export UPSILON_GAMMA=1.3

# If taps land in the wrong place, the panel is rotated relative to the
# screen: try combinations of these.
#export UPSILON_TOUCH_SWAP_XY=1
#export UPSILON_TOUCH_MIRROR_X=1
#export UPSILON_TOUCH_MIRROR_Y=1
#export UPSILON_TOUCH_DEVICE=/dev/input/event1

# Leave the Kindle UI running when started from the library or KUAL (only
# if you know what you are doing: it may draw over the calculator). This is
# always the case when started from KOReader.
#KEEP_FRAMEWORK=1
